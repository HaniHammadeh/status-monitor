name: Gemini Security Scan

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "app/main.py"
      - "Dockerfile"
      - "requirements.txt"

jobs:
  scan:
    runs-on:
      - ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository with gitleaks
        run: |
          python3 -m pip install google-genai
          chmod +x security_review.py
          python3 security_review.py app/main.py
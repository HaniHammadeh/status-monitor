name: Gemini Security Scan

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "app/main.py"
      - "Dockerfile"
      - "requirements.txt"

jobs:
  scan:
    environment: dev
    runs-on:
      - ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan repository with Gemini
        run: |
          export GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          python3 -m pip install google-genai
          chmod +x security_review.py
          python3 security_review.py app/main.py > security-report.md
      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md
          retention-days: 30
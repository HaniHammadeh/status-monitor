name: Build Container

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "app/main.py"
      - "Dockerfile"
      - "requirements.txt"

jobs:    
  build:
    runs-on: ubuntu-latest
    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate short commit
        run: |
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - run: pip install -r requirements.txt
      - run: | 
          docker build \
                --build-arg VERSION=${{ github.sha }} \
                --build-arg COMMIT=${{ env.SHORT_SHA }} \
                --build-arg BUILD_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ") \
                -t hanihammadeh/status-monitor:${{ github.sha }} .

      - run: docker push hanihammadeh/status-monitor:${{ github.sha }}

  deploy_on_dev:
    needs: build
    runs-on: self-hosted
    steps:
      - name: check out
        uses: actions/checkout@v4
      - name: Deploy image to Staging
        run: |
          kubectl set image deployment/api \
            api=hanihammadeh/status-monitor:${{ github.sha}} \
            -n staging

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api \
            -n staging \
            --timeout=120s

      - name: Show deployment
        run: |
          kubectl get pods -n staging
  
  
